name: Android validation and release

on:
  push:
    branches: [main, fix/s22-layout-and-typing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit, layout, gesture and lint checks; build installable APK
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-configuration-cache --stacktrace
      - name: Prepare download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NeuralKey-AI-Keyboard-v1.1.0.apk
          cd dist
          sha256sum NeuralKey-AI-Keyboard-v1.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NeuralKey-v1.1.0
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NeuralKey-v1.1.0
          path: dist
      - name: Publish verified development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo 'v1.1.0 already exists; leaving the published release unchanged.'
          else
            gh release create v1.1.0 dist/* --target "$GITHUB_SHA" --title 'NeuralKey v1.1.0 - S22 layout and offline typing' --notes-file docs/releases/v1.1.0.md
          fi
