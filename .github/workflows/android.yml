name: Android validation and release

on:
  push:
    branches: [main, fix/s22-first-show]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: 13114758
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit, layout, gesture and lint checks; build installable APK
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-configuration-cache --stacktrace
      - name: Prepare download
        run: |
          mkdir -p dist
          python - <<'PY'
          import gzip, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/debug/app-debug.apk') as apk:
              words = gzip.decompress(apk.read('assets/english_words.dict')).decode().splitlines()
              assert len(words) > 100000, 'Offline dictionary missing or incomplete'
              assert 'assets/licenses/english-dictionary.txt' in apk.namelist()
          PY
          cp app/build/outputs/apk/debug/app-debug.apk dist/NeuralKey-AI-Keyboard-v1.1.1.apk
          cd dist
          sha256sum NeuralKey-AI-Keyboard-v1.1.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NeuralKey-v1.1.1
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: NeuralKey-v1.1.1
          path: dist
      - name: Publish verified development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.1 >/dev/null 2>&1; then
            echo 'v1.1.1 already exists; leaving the published release unchanged.'
          else
            gh release create v1.1.1 dist/* --target "$GITHUB_SHA" --title 'NeuralKey v1.1.1 - Samsung layout follow-up' --notes-file docs/releases/v1.1.1.md
          fi
